name: Discover historical European clubs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-historical-clubs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Discover clubs and import career records from Wikidata
        run: npm run discover:historical-clubs

      - name: Save updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/football-db.json
          if git diff --cached --quiet; then
            echo "No database changes to save."
          else
            git commit -m "Discover historical European clubs and careers"
            git push
          fi
